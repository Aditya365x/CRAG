services:
  - type: web
    name: crag-app
    runtime: docker
    plan: starter            # MiniLM + FAISS needs ~1GB RAM; the free 512MB tier is too small
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
